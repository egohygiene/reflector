name: Reflector publication hub

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - ".latexmkrc"
      - "Taskfile.yml"
      - "VERSION"
      - "docs/**"
      - "magazine/**"
      - "metadata/**"
      - "paper/**"
      - "publication.json"
      - "scripts/build-magazine.sh"
      - "scripts/build-paper.sh"
      - "scripts/generate_pdf_previews.py"
      - "scripts/stage-pages.py"
      - "tests/test_stage_pages.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - ".latexmkrc"
      - "Taskfile.yml"
      - "VERSION"
      - "docs/**"
      - "magazine/**"
      - "metadata/**"
      - "paper/**"
      - "publication.json"
      - "scripts/build-magazine.sh"
      - "scripts/build-paper.sh"
      - "scripts/generate_pdf_previews.py"
      - "scripts/stage-pages.py"
      - "tests/test_stage_pages.py"
  workflow_dispatch:
    inputs:
      deploy_scope:
        description: "Publication artifacts to rebuild before deployment"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - paper
          - magazine

permissions:
  contents: read

concurrency:
  group: reflector-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CANONICAL_URL: "https://reflector.egohygiene.io/"
  FALLBACK_URL: "https://egohygiene.github.io/reflector/"

jobs:
  build:
    name: Build and review publication hub
    runs-on: ubuntu-24.04

    outputs:
      review_artifact_name: ${{ steps.context.outputs.review_artifact_name }}
      source_revision: ${{ steps.context.outputs.source_revision }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Establish deterministic build context
        id: context
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REVISION="$(git rev-parse HEAD)"
          SOURCE_EPOCH="$(git show --no-patch --format=%ct HEAD)"
          GENERATED_AT="$(date --utc --date="@${SOURCE_EPOCH}" "+%Y-%m-%dT%H:%M:%SZ")"
          REVIEW_ARTIFACT_NAME="reflector-pages-review-${SOURCE_REVISION}"

          echo "source_revision=${SOURCE_REVISION}" >> "${GITHUB_OUTPUT}"
          echo "source_epoch=${SOURCE_EPOCH}" >> "${GITHUB_OUTPUT}"
          echo "generated_at=${GENERATED_AT}" >> "${GITHUB_OUTPUT}"
          echo "review_artifact_name=${REVIEW_ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

          echo "SOURCE_DATE_EPOCH=${SOURCE_EPOCH}" >> "${GITHUB_ENV}"
          echo "FORCE_SOURCE_DATE=1" >> "${GITHUB_ENV}"
          echo "TZ=UTC" >> "${GITHUB_ENV}"

      - name: Determine build scope
        id: scope
        env:
          REQUESTED_SCOPE: ${{ inputs.deploy_scope || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_PAPER="true"
          BUILD_MAGAZINE="true"
          RESOLVED_SCOPE="full"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${REQUESTED_SCOPE}" in
              auto|full)
                ;;
              paper)
                BUILD_MAGAZINE="false"
                RESOLVED_SCOPE="paper"
                ;;
              magazine)
                BUILD_PAPER="false"
                RESOLVED_SCOPE="magazine"
                ;;
              *)
                echo "::error::Invalid deploy scope: ${REQUESTED_SCOPE}"
                exit 1
                ;;
            esac
          fi

          echo "build_paper=${BUILD_PAPER}" >> "${GITHUB_OUTPUT}"
          echo "build_magazine=${BUILD_MAGAZINE}" >> "${GITHUB_OUTPUT}"
          echo "resolved_scope=${RESOLVED_SCOPE}" >> "${GITHUB_OUTPUT}"

      - name: Install native publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            biber \
            latexmk \
            lmodern \
            poppler-utils \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures \
            webp

      - name: Run Pages contract unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q "scripts/stage-pages.py" "tests/test_stage_pages.py"
          python3 -m unittest "tests/test_stage_pages.py"

      - name: Resolve protected release fallback
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${GITHUB_OUTPUT}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          manifest = json.loads(Path("publication.json").read_text(encoding="utf-8"))
          repository_url = manifest.get("repository_url")
          release_tag = manifest.get("release_tag")
          release_url = manifest.get("release_url")

          if repository_url != "https://github.com/egohygiene/reflector":
              raise SystemExit("publication.json repository_url is not the protected Reflector repository")
          if not isinstance(release_tag, str) or not re.fullmatch(r"v\d+\.\d+\.\d+", release_tag):
              raise SystemExit("publication.json release_tag must be a semantic-version tag")

          expected_release_url = f"{repository_url}/releases/tag/{release_tag}"
          if release_url is None:
              release_url = expected_release_url
          if release_url != expected_release_url:
              raise SystemExit(
                  "publication.json release_url must agree with repository_url and release_tag"
              )

          parsed = urlsplit(release_url)
          if parsed.scheme != "https" or parsed.netloc != "github.com" or parsed.query or parsed.fragment:
              raise SystemExit("release_url must be a clean HTTPS github.com release URL")

          baseline_path = Path("metadata/releases") / f"{release_tag}.json"
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          if baseline.get("schema_version") != "1.0.0":
              raise SystemExit(f"Unsupported release baseline schema: {baseline_path}")
          if baseline.get("release_tag") != release_tag:
              raise SystemExit(f"Release baseline tag does not match publication.json: {baseline_path}")
          if not re.fullmatch(r"[0-9a-f]{40}", str(baseline.get("release_commit", ""))):
              raise SystemExit(f"Release baseline has an invalid commit: {baseline_path}")

          checksums_asset = baseline.get("checksums_asset", {})
          if checksums_asset.get("filename") != "checksums.txt" or not re.fullmatch(
              r"[0-9a-f]{64}", str(checksums_asset.get("sha256", ""))
          ):
              raise SystemExit(f"Release baseline has an invalid checksums asset: {baseline_path}")

          required_artifacts = {
              "reflector.pdf",
              "reflector-magazine.pdf",
              "reflector-magazine-print.pdf",
          }
          artifacts = baseline.get("artifacts", {})
          if set(artifacts) != required_artifacts:
              raise SystemExit(f"Release baseline artifact set is incomplete: {baseline_path}")
          for filename, record in artifacts.items():
              if not isinstance(record, dict) or not re.fullmatch(
                  r"[0-9a-f]{64}", str(record.get("sha256", ""))
              ):
                  raise SystemExit(f"Release baseline digest is invalid for {filename}")
              if not isinstance(record.get("size_bytes"), int) or record["size_bytes"] <= 0:
                  raise SystemExit(f"Release baseline size is invalid for {filename}")

          download_base = release_url.replace("/releases/tag/", "/releases/download/", 1)
          output_path = Path(sys.argv[1])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"release_tag={release_tag}\n")
              output.write(f"release_url={release_url}\n")
              output.write(f"download_base={download_base}\n")
              output.write(f"baseline_path={baseline_path.as_posix()}\n")
          PY

      - name: Prepare publication artifact inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir --parents ".pages-inputs"

      - name: Build paper with its native builder
        if: steps.scope.outputs.build_paper == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-paper.sh "paper"
          install --mode="0644" \
            "paper/.cache/out/paper.pdf" \
            ".pages-inputs/reflector.pdf"

      - name: Print paper diagnostics on failure
        if: failure() && steps.scope.outputs.build_paper == 'true'
        shell: bash
        run: |
          set +e
          ./scripts/print-latex-diagnostics.sh "paper"

      - name: Build magazines with their native builder
        if: steps.scope.outputs.build_magazine == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-magazine.sh "build-all"
          install --mode="0644" \
            "magazine/dist/reflector-magazine.pdf" \
            ".pages-inputs/reflector-magazine.pdf"
          install --mode="0644" \
            "magazine/dist/reflector-magazine-print.pdf" \
            ".pages-inputs/reflector-magazine-print.pdf"

      - name: Download skipped artifacts from the protected release
        if: steps.scope.outputs.build_paper != 'true' || steps.scope.outputs.build_magazine != 'true'
        env:
          BUILD_MAGAZINE: ${{ steps.scope.outputs.build_magazine }}
          BUILD_PAPER: ${{ steps.scope.outputs.build_paper }}
          RELEASE_BASELINE: ${{ steps.release.outputs.baseline_path }}
          RELEASE_DOWNLOAD_BASE: ${{ steps.release.outputs.download_base }}
        shell: bash
        run: |
          set -euo pipefail

          CURL_OPTIONS=(
            --fail
            --location
            --proto "=https"
            --proto-redir "=https"
            --retry 4
            --retry-all-errors
            --show-error
            --silent
          )
          CHECKSUMS_FILE=".pages-inputs/release-checksums.txt"
          curl "${CURL_OPTIONS[@]}" \
            --output "${CHECKSUMS_FILE}" \
            "${RELEASE_DOWNLOAD_BASE}/checksums.txt"

          python3 - "${RELEASE_BASELINE}" "${CHECKSUMS_FILE}" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          baseline = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          checksums_path = Path(sys.argv[2])
          checksums_bytes = checksums_path.read_bytes()
          expected_asset_sha = baseline["checksums_asset"]["sha256"]
          actual_asset_sha = hashlib.sha256(checksums_bytes).hexdigest()
          if actual_asset_sha != expected_asset_sha:
              raise SystemExit(
                  "Downloaded checksums.txt does not match the reviewed release baseline"
              )

          release_checksums = {}
          for line in checksums_bytes.decode("utf-8").splitlines():
              parts = line.split("  ", 1)
              if len(parts) != 2 or not re.fullmatch(r"[0-9a-f]{64}", parts[0]):
                  raise SystemExit(f"Invalid release checksums.txt entry: {line!r}")
              if parts[1] in release_checksums:
                  raise SystemExit(f"Duplicate release checksums.txt path: {parts[1]}")
              release_checksums[parts[1]] = parts[0]

          for filename, record in baseline["artifacts"].items():
              if release_checksums.get(filename) != record["sha256"]:
                  raise SystemExit(
                      f"Release checksums.txt disagrees with the reviewed baseline for {filename}"
                  )
          PY

          download_and_verify() {
            local filename="$1"
            local target=".pages-inputs/${filename}"
            local expected
            local expected_size
            local actual
            local actual_size

            read -r expected expected_size < <(python3 - "${RELEASE_BASELINE}" "${filename}" <<'PY'
          import json
          import sys
          from pathlib import Path

          baseline = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          filename = sys.argv[2]
          record = baseline["artifacts"].get(filename)
          if not isinstance(record, dict):
              raise SystemExit(f"No reviewed release baseline exists for {filename}")
          print(record["sha256"], record["size_bytes"])
          PY
            )

            curl "${CURL_OPTIONS[@]}" \
              --output "${target}" \
              "${RELEASE_DOWNLOAD_BASE}/${filename}"
            actual="$(sha256sum "${target}" | cut --delimiter=" " --fields=1)"
            actual_size="$(wc --bytes < "${target}" | tr --delete "[:space:]")"
            if [[ "${actual}" != "${expected}" || "${actual_size}" != "${expected_size}" ]]; then
              echo "::error::Release baseline mismatch for ${filename}"
              exit 1
            fi
            echo "Verified reviewed release fallback: ${filename} (${actual}, ${actual_size} bytes)"
          }

          if [[ "${BUILD_PAPER}" != "true" ]]; then
            download_and_verify "reflector.pdf"
          fi
          if [[ "${BUILD_MAGAZINE}" != "true" ]]; then
            download_and_verify "reflector-magazine.pdf"
            download_and_verify "reflector-magazine-print.pdf"
          fi

      - name: Validate PDF inputs and generate previews
        shell: bash
        run: |
          set -euo pipefail

          for pdf in \
            ".pages-inputs/reflector.pdf" \
            ".pages-inputs/reflector-magazine.pdf" \
            ".pages-inputs/reflector-magazine-print.pdf"
          do
            test -s "${pdf}"
            pdfinfo "${pdf}" >/dev/null
          done

          rm --force --recursive ".pages-previews"
          python3 "scripts/generate_pdf_previews.py" \
            --output-dir ".pages-previews" \
            --preview "paper-cover=.pages-inputs/reflector.pdf" \
            --preview "magazine-cover=.pages-inputs/reflector-magazine.pdf" \
            --preview "print-cover=.pages-inputs/reflector-magazine-print.pdf"

      - name: Stage and byte-compare the complete site twice
        env:
          GENERATED_AT: ${{ steps.context.outputs.generated_at }}
          SOURCE_REVISION: ${{ steps.context.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail

          stage_site() {
            local output_dir="$1"
            python3 "scripts/stage-pages.py" \
              --project-root "." \
              --docs-dir "docs" \
              --output-dir "${output_dir}" \
              --publication-manifest "publication.json" \
              --paper-pdf ".pages-inputs/reflector.pdf" \
              --magazine-pdf ".pages-inputs/reflector-magazine.pdf" \
              --magazine-print-pdf ".pages-inputs/reflector-magazine-print.pdf" \
              --preview-dir ".pages-previews" \
              --hero "paper/figures/hero.png" \
              --source-revision "${SOURCE_REVISION}" \
              --generated-at "${GENERATED_AT}"
          }

          stage_site "_site"
          stage_site "_site-recheck"
          diff --brief --no-dereference --recursive "_site" "_site-recheck"

          python3 "scripts/stage-pages.py" \
            --project-root "." \
            --docs-dir "docs" \
            --output-dir "_site" \
            --publication-manifest "publication.json" \
            --paper-pdf ".pages-inputs/reflector.pdf" \
            --magazine-pdf ".pages-inputs/reflector-magazine.pdf" \
            --magazine-print-pdf ".pages-inputs/reflector-magazine-print.pdf" \
            --preview-dir ".pages-previews" \
            --hero "paper/figures/hero.png" \
            --source-revision "${SOURCE_REVISION}" \
            --generated-at "${GENERATED_AT}" \
            --validate-only

          cmp --silent "publication.json" "_site/publication.json"
          (
            cd "_site"
            sha256sum --check --strict "SHA256SUMS"
          )

          SOURCE_STATUS="$(git status --porcelain=v1 --untracked-files=all -- "docs" "publication.json")"
          if [[ -n "${SOURCE_STATUS}" ]]; then
            echo "::error::Pages staging changed protected repository source paths."
            printf '%s\n' "${SOURCE_STATUS}"
            exit 1
          fi

          rm --force "_site/.reflector-pages-owned"
          test ! -e "_site/.reflector-pages-owned"
          rm --force --recursive "_site-recheck"

      - name: Summarize review artifact
        env:
          RESOLVED_SCOPE: ${{ steps.scope.outputs.resolved_scope }}
          SOURCE_REVISION: ${{ steps.context.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Reflector Pages review"
            echo
            echo "- Canonical URL: ${CANONICAL_URL}"
            echo "- Source revision: \`${SOURCE_REVISION}\`"
            echo "- Build scope: \`${RESOLVED_SCOPE}\`"
            echo "- Protected publication manifest: byte-for-byte preserved"
            echo "- Beacon: not used"
            echo
            echo "### Publication artifacts"
            echo
            echo "| Artifact | Size (bytes) | SHA-256 |"
            echo "| --- | ---: | --- |"
            while read -r digest path; do
              case "${path}" in
                reflector.pdf|reflector-magazine.pdf|reflector-magazine-print.pdf)
                  size="$(wc --bytes < "_site/${path}" | tr --delete "[:space:]")"
                  echo "| ${path} | ${size} | \`${digest}\` |"
                  ;;
              esac
            done < "_site/SHA256SUMS"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.context.outputs.review_artifact_name }}
          path: _site
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Upload native build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reflector-pages-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            paper/.cache/
            magazine/.cache/
            magazine/dist/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy canonical publication hub
    needs:
      - build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download expected review artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.review_artifact_name }}
          path: _expected-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify canonical deployment and complete checksum inventory
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_REVISION: ${{ needs.build.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail

          DEPLOYED_URL="${DEPLOYED_URL//$'\r'/}"
          DEPLOYED_URL="${DEPLOYED_URL//$'\n'/}"
          if [[ "${DEPLOYED_URL}" != "${CANONICAL_URL}" ]]; then
            echo "::error::Pages must report the canonical HTTPS URL ${CANONICAL_URL}; got ${DEPLOYED_URL}"
            echo "::error::Select GitHub Actions as the sole Pages source and enable Enforce HTTPS."
            exit 1
          fi

          CURL_OPTIONS=(
            --fail
            --location
            --proto "=https"
            --proto-redir "=https"
            --retry 8
            --retry-all-errors
            --retry-delay 5
            --show-error
            --silent
          )

          mkdir --parents "_remote-site"

          published_revision=""
          for attempt in {1..12}; do
            curl "${CURL_OPTIONS[@]}" \
              --output "_remote-site/site.json" \
              "${CANONICAL_URL}site.json?revision=${SOURCE_REVISION}"
            published_revision="$(python3 - <<'PY'
          import json
          from pathlib import Path

          print(json.loads(Path("_remote-site/site.json").read_text(encoding="utf-8")).get("source_revision", ""))
          PY
            )"
            if [[ "${published_revision}" == "${SOURCE_REVISION}" ]]; then
              break
            fi
            echo "Attempt ${attempt}: deployed revision is ${published_revision:-<missing>}; waiting for ${SOURCE_REVISION}."
            sleep 10
          done
          if [[ "${published_revision}" != "${SOURCE_REVISION}" ]]; then
            echo "::error::Published site.json does not represent ${SOURCE_REVISION}."
            exit 1
          fi

          ROUTES=(
            ""
            "paper/"
            "magazine/"
            "magazine/print/"
            "downloads/"
            "publication.json"
            "site.json"
            "SHA256SUMS"
            "reflector.pdf"
            "reflector-magazine.pdf"
            "reflector-magazine-print.pdf"
          )
          for route in "${ROUTES[@]}"; do
            expected_url="${CANONICAL_URL}${route}"
            echo "Checking canonical route: ${CANONICAL_URL}${route}"
            effective_url="$(curl "${CURL_OPTIONS[@]}" \
              --output "/dev/null" \
              --write-out "%{url_effective}" \
              "${expected_url}")"
            if [[ "${effective_url}" != "${expected_url}" ]]; then
              echo "::error::Canonical route ${expected_url} resolved to ${effective_url}."
              exit 1
            fi
          done

          curl "${CURL_OPTIONS[@]}" \
            --output "_remote-site/SHA256SUMS" \
            "${CANONICAL_URL}SHA256SUMS?revision=${SOURCE_REVISION}"
          cmp --silent "_expected-site/SHA256SUMS" "_remote-site/SHA256SUMS"

          python3 - <<'PY' > "_remote-files.txt"
          import re
          from pathlib import Path, PurePosixPath

          paths = []
          for line in Path("_expected-site/SHA256SUMS").read_text(encoding="utf-8").splitlines():
              parts = line.split("  ", 1)
              if len(parts) != 2 or not re.fullmatch(r"[0-9a-f]{64}", parts[0]):
                  raise SystemExit(f"Invalid expected SHA256SUMS entry: {line!r}")
              relative = PurePosixPath(parts[1])
              if relative.is_absolute() or ".." in relative.parts or not relative.parts:
                  raise SystemExit(f"Unsafe expected Pages path: {relative}")
              paths.append(relative.as_posix())
          if paths != sorted(set(paths)):
              raise SystemExit("Expected SHA256SUMS paths must be unique and sorted")
          print("\n".join(paths))
          PY

          while IFS= read -r relative_path; do
            mkdir --parents "_remote-site/$(dirname "${relative_path}")"
            curl "${CURL_OPTIONS[@]}" \
              --output "_remote-site/${relative_path}" \
              "${CANONICAL_URL}${relative_path}?revision=${SOURCE_REVISION}"
          done < "_remote-files.txt"

          (
            cd "_remote-site"
            sha256sum --check --strict "SHA256SUMS"
          )

          cmp --silent "_expected-site/publication.json" "_remote-site/publication.json"
          cmp --silent "_expected-site/site.json" "_remote-site/site.json"

      - name: Verify fallback URL redirects or serves the canonical revision
        shell: bash
        run: |
          set -euo pipefail

          mkdir --parents "_fallback-site"
          python3 - <<'PY' > "_fallback-routes.tsv"
          import json
          from pathlib import Path

          catalog = json.loads(
              Path("_expected-site/site.json").read_text(encoding="utf-8")
          )
          for route in catalog["routes"]:
              public_path = route["path"].lstrip("/") or "."
              print(f"{public_path}\t{route['physical_path']}")
          PY

          route_index=0
          while IFS=$'\t' read -r public_path physical_path; do
            if [[ "${public_path}" == "." ]]; then
              public_path=""
            fi
            expected_fallback_url="${FALLBACK_URL}${public_path}"
            expected_canonical_url="${CANONICAL_URL}${public_path}"
            response_path="_fallback-site/route-${route_index}"
            effective_url="$(curl \
              --fail \
              --location \
              --proto "=https" \
              --proto-redir "=https" \
              --retry 8 \
              --retry-all-errors \
              --retry-delay 5 \
              --show-error \
              --silent \
              --output "${response_path}" \
              --write-out "%{url_effective}" \
              "${expected_fallback_url}")"

            case "${effective_url}" in
              "${expected_fallback_url}")
                echo "Fallback serves ${public_path:-/} directly."
                ;;
              "${expected_canonical_url}")
                echo "Fallback redirects ${public_path:-/} to the canonical HTTPS route."
                ;;
              *)
                echo "::error::Fallback route ${expected_fallback_url} resolved to ${effective_url}."
                exit 1
                ;;
            esac

            cmp --silent "_expected-site/${physical_path}" "${response_path}"
            route_index=$((route_index + 1))
          done < "_fallback-routes.tsv"

      - name: Summarize canonical deployment
        env:
          SOURCE_REVISION: ${{ needs.build.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Canonical Reflector deployment"
            echo
            echo "- URL: ${CANONICAL_URL}"
            echo "- Revision: \`${SOURCE_REVISION}\`"
            echo "- Publication manifest: byte-for-byte verified"
            echo "- Complete public file inventory: SHA-256 verified"
            echo "- Fallback: redirect/serve behavior verified over HTTPS"
          } >> "${GITHUB_STEP_SUMMARY}"
